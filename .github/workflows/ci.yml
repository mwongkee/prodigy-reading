name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: App (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    name: Infra (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform validate
        # No backend/credentials needed — validate only checks configuration.
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
